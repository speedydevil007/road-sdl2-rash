# Road Rash mod settings (hosted builds: the Windows, Linux and web builds from
# port/host). Copy to port/userdata/mods.ini (or $RR_SETTINGS_DIR/mods.ini).
#
# Every setting is off by default: an absent file or key keeps the original
# game. Lines are "key = value"; '#' starts a comment; keys ignore case.
# RR_MODS="key=value;key=value" overrides the file for one run.
# The game prints one "[mods]" line per active setting and warns about any key
# it does not know. RR_MODS_TRACE=1 also prints every bike loaded for a racer
# (racer type, bike number, throttle and brake caps) and every changed value;
# RR_MODS_TRACE=2 adds the race standings every 20 seconds of race time.
# Guide with every key, measured effects and recipes: port/MODS.md. Code: port/game/mods.c.

# --- Traffic -----------------------------------------------------------------
# Speed of the traffic cars (signed byte, the original sets 25). Larger =
# faster cars. Rival bikers do not use it. (Older name: rival_speed_scalar.)
# traffic_speed_scalar = 25

# --- Bikes (DATA/BIKESPEC.RSC is never modified; the loaded copy is) ---------
# bike.<n>.<field> = value, n = 1..15 (record in BIKESPEC.RSC), its short name,
# or "all". Bikes (number, short name, shop name):
#    1 sport450 Banzai Sport 450      6 supersport Banzai Super Sport   11 vampiro Diablo Vampiro
#    2 swallow  Corsair Swallow       7 raven   Corsair Raven N         12 m10     DMG M10
#    3 zyx250   Kamikaze ZYX 250      8 vipera  Diablo Vipera N         13 zyx750  Kamikaze ZYX 750
#    4 rat      Killer Rat            9 zyx750n Kamikaze ZYX 750N       14 grande  Perro Grande
#    5 pico     Perro Pico           10 assassino Stiletto Assassino N  15 aggressore Stiletto Aggressore
# The player starts on 2 (swallow).
# A bike.<n> line beats a bike.all line. Changes every racer on that bike.
#   power   engine power (original bikes 35..48): the throttle cap and how fast
#           the throttle rises and falls.
#   brakes  brake strength (original -40..-120; more negative = stronger).
#   0xNNN   any dword of the 0x164-byte record, for experiments (0x000..0x160).
# bike.all.power = 50
# bike.swallow.brakes = -150

# --- Physics (every racer, the player included) -------------------------------
# Percent of the original (0..1000). Flat out on Napa the player tops out at
# about 11,200; half the air drag gives about 16,900 (+51%). Rivals' speed is
# set by their AI, so they gain less (use rival_pace_percent for them).
# physics_air_drag_percent = 100
# physics_offroad_drag_percent = 100    # how much the ground beside the road slows you
# physics_grip_percent = 100            # traction everywhere (lower = slides sooner)
# physics_offroad_grip_percent = 100    # traction off the road

# --- Field ---------------------------------------------------------------------
# Number of bikers including the player (2..15; the original races 15). Fewer
# racers only: the game's tables hold at most 15 bikers and a cop.
# racer_count = 15

# --- Rivals -------------------------------------------------------------------
# Percent of the original (0..1000). Applies to every rival (never the player).
# rival_pace_percent: how hard rivals ride (the per-level pace they start from
#   before catching up or easing off, and their top pace while chasing someone).
# rival_chase_percent: the lowest pace a rival keeps while chasing a target.
# Tested: pace 50 makes the field much slower, 120 faster; 150 is faster only
# for the first minute and then slower than the original (not understood yet).
# rival_pace_percent = 100
# rival_chase_percent = 100

# Fights. Each rider style holds a grudge against every other rider; above a
# level-dependent threshold a rival attacks whoever it rides next to.
# rival_feud_percent: grudges between rivals (more = they fight each other more).
# rival_grudge_player_percent: grudges against the player.
# rival_retaliation_percent: how much a hit raises the victim's grudge against
#   the one who hit it (more = hits start feuds that last).
# Tested (Napa, attacks by rivals over a race: original 6 on rivals, 0 on the
# player): feud 200 -> 36 on rivals; grudge_player 200 -> 4 on the player.
# Riders in slots 9..14 have no grudge row in the original: nobody targets them.
# rival_grudge_generic_percent gives them one: this percent of a rival's
#   average grudge against the other rivals (0 = original, 100 = like any rival).
# rival_feud_percent = 100
# rival_grudge_player_percent = 100
# rival_retaliation_percent = 100
# rival_grudge_generic_percent = 0
